<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>修改密碼 - MiniClinic</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; max-width: 720px; margin: 80px auto; padding: 0 20px; }
        h1 { color: #0F2443; text-align: center; }
        form { margin-top: 28px; }
        label { display: block; margin-top: 16px; font-weight: bold; color: #0F2443; }
        input { width: 100%; padding: 12px; margin-top: 6px; border: 1px solid #CBD5E1; border-radius: 4px; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; margin-top: 24px; padding: 12px; background: #14B8A6; color: white; border: none; border-radius: 4px; font-size: 18px; cursor: pointer; }
        .error { background: #FEE2E2; color: #B91C1C; padding: 12px; border-radius: 4px; margin-top: 20px; }
        .success { background: #DCFCE7; color: #166534; padding: 12px; border-radius: 4px; margin-top: 20px; }
        .links { text-align: center; margin-top: 24px; }
    </style>
</head>
<body>
    <h1>修改密碼</h1>
    <p style="text-align: center;">醫師：<span th:text="${doctorName}">醫師姓名</span></p>

    <div class="error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
    <div class="success" th:if="${successMessage}" th:text="${successMessage}"></div>

    <form th:action="@{/password}" th:object="${passwordForm}" method="post">
        <label>舊密碼</label>
        <input type="password" th:field="*{oldPassword}" required>

        <label>新密碼</label>
        <input type="password" th:field="*{newPassword}" required>

        <label>確認新密碼</label>
        <input type="password" th:field="*{confirmPassword}" required>

        <button type="submit">更新密碼</button>
    </form>

    <p class="links">
        <a th:href="@{/dashboard}">回 Dashboard</a>
    </p>
</body>
</html>
